# Build Playwright Chromium 1.62 rev1234 (151.0.7922.34) for Windows ARM64.
#
# Single Windows job (hosted 6h hard cap): restore cache → sync → compile → pack → release → save cache.
# Split sync/build was abandoned: Actions cache of gclient (~20–25GB) saved in Sync was not
# restorable in Build (run 35921596181), so Build cold-started and wasted the 6h budget.
#
# Full Chromium src (~50GB+) still cannot fit in Actions cache. We only cache depot_tools +
# gclient object cache to speed the *next* run's sync when *.pack files are present (warm).
# Cold runs must NOT use --git-cache (GCS mirror is ~1-2 KiB/s on hosted ARM; run 35940687183).
# timeout-minutes >360 does NOT raise the hosted 6h cap.
#
# Runner: prefer windows-11-vs2026-arm; AtlasGraph reference windows-11-arm.
# Do not silently switch labels on disk failure.
name: Build Windows ARM64 Chromium

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub-hosted Windows ARM label (AtlasGraph uses windows-11-arm)"
        type: choice
        options:
          - windows-11-vs2026-arm
          - windows-11-arm
        default: windows-11-vs2026-arm
      delete_git_after_sync:
        description: "DELETE_GIT_AFTER_SYNC=1 after gclient sync (saves disk; skip slow git gc)"
        type: boolean
        default: true
      create_release:
        description: "Upload GitHub Release v1.62.1234-cn.1"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

env:
  PLAYWRIGHT_VERSION: "1.62.0"
  CHROMIUM_REVISION: "1234"
  CHROME_TAG: "151.0.7922.34"
  RELEASE_TAG: "v1.62.1234-cn.1"
  PACKAGE_STEM: "playwright-chromium-windows-aarch64-1.62.1234+cn.1"
  # Bump when cache layout / key strategy changes
  # v5: cold fetch skips GCS git-cache (run 35940687183); warm = depot_tools bootstrapped + *.pack in gclient-cache
  # v4: require bootstrapped depot_tools; invalidate incomplete v3 from run 35939021520
  CACHE_SCHEMA: "v5"

jobs:
  probe:
    name: Probe upstream win-arm64 zips
    runs-on: ubuntu-latest
    outputs:
      any_200: ${{ steps.head.outputs.any_200 }}
    steps:
      - name: HEAD-check public URLs
        id: head
        run: |
          set +e
          urls=(
            "https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.34/win-arm64/chrome-win-arm64.zip"
            "https://cdn.playwright.dev/builds/chromium/1234/chromium-win-arm64.zip"
            "https://cdn.playwright.dev/builds/chromium/1234/chromium-win32_arm64.zip"
          )
          any=0
          for u in "${urls[@]}"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -I -L --max-time 30 "$u" || echo "000")
            echo "$code  $u"
            if [ "$code" = "200" ]; then
              any=1
              echo "::notice title=Upstream zip available::$u returned HTTP 200 — prefer official download over self-build"
            fi
          done
          echo "any_200=$any" >> "$GITHUB_OUTPUT"
          if [ "$any" = "1" ]; then
            echo "::warning::At least one public win-arm64 zip returned 200. Self-build may be unnecessary; continuing build job anyway (soft)."
          fi

  build:
    name: Sync + build + pack on Windows ARM
    needs: probe
    runs-on: ${{ inputs.runner }}
    # Hosted Windows jobs hard-cap at 6h regardless of a higher timeout-minutes.
    timeout-minutes: 360
    steps:
      - name: Disk / arch preflight
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "Expected ARM64 runner" }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
          $free = (Get-PSDrive C).Free
          if ($free -lt 20GB) {
            Write-Warning "Low free disk on C: $([math]::Round($free/1GB,1)) GB. Chromium typically needs >=100GB free; this hosted image may fail. Do not switch labels silently — report disk failure."
          }

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show VS / toolchain
        shell: pwsh
        run: |
          if (Get-Command vswhere -ErrorAction SilentlyContinue) {
            & vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          } else {
            Write-Warning "vswhere not found"
          }

      # Stable key (no run_id): next run can restore. Same-job handoff no longer needed.
      # Prefer v4; fall back to v3/v2 keys. Verify step rejects unbootstrapped depot_tools.
      - name: Restore depot_tools + gclient cache
        id: cache_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/depot_tools
            ${{ runner.temp }}/gclient-cache
          key: ${{ env.CACHE_SCHEMA }}-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-${{ inputs.runner }}
          restore-keys: |
            ${{ env.CACHE_SCHEMA }}-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-${{ inputs.runner }}-
            ${{ env.CACHE_SCHEMA }}-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-
            ${{ env.CACHE_SCHEMA }}-winarm-gclient-${{ env.CHROME_TAG }}-
            v3-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-${{ inputs.runner }}-
            v3-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-
            v3-winarm-gclient-${{ env.CHROME_TAG }}-
            v2-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-${{ inputs.runner }}-
            v2-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-
            v2-winarm-gclient-${{ env.CHROME_TAG }}-

      # Run 35866577988: cache "hit" then Azure auth failed mid-download; verify on disk.
      - name: Verify cache restore on disk
        id: cache_ok
        shell: pwsh
        run: |
          $dt = Join-Path $env:RUNNER_TEMP 'depot_tools'
          $gc = Join-Path $env:RUNNER_TEMP 'gclient-cache'
          $hasDt = (Test-Path (Join-Path $dt 'gclient.bat')) -or (Test-Path (Join-Path $dt 'gclient'))
          $bootstrapped = Test-Path (Join-Path $dt 'python3_bin_reldir.txt')
          $n = 0
          $packs = 0
          if (Test-Path $gc) {
            $n = @(Get-ChildItem $gc -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 20).Count
            $packs = @(Get-ChildItem $gc -Recurse -Filter '*.pack' -ErrorAction SilentlyContinue | Select-Object -First 3).Count
          }
          Write-Host "depot_tools=$hasDt bootstrapped=$bootstrapped gclient-cache-sample-files=$n pack-samples=$packs"
          # Incomplete cache (clone only, no CIPD/python bootstrap) looks "present" but fetch fails
          # (run 35939021520). Partial gsutil populate without *.pack is also a miss (run 35940687183).
          if ($hasDt -and $bootstrapped -and $packs -gt 0) {
            'present=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            'present=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Warning 'Cache restore empty/miss/unbootstrapped/no-packs; cold fetch WITHOUT GCS git-cache.'
          }

      - name: Retry restore depot_tools + gclient cache
        if: ${{ steps.cache_ok.outputs.present != 'true' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/depot_tools
            ${{ runner.temp }}/gclient-cache
          key: ${{ env.CACHE_SCHEMA }}-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-${{ inputs.runner }}
          restore-keys: |
            ${{ env.CACHE_SCHEMA }}-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-${{ inputs.runner }}-
            ${{ env.CACHE_SCHEMA }}-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-
            ${{ env.CACHE_SCHEMA }}-winarm-gclient-${{ env.CHROME_TAG }}-
            v3-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-${{ inputs.runner }}-
            v3-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-
            v3-winarm-gclient-${{ env.CHROME_TAG }}-
            v2-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-${{ inputs.runner }}-
            v2-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-
            v2-winarm-gclient-${{ env.CHROME_TAG }}-

      - name: Sync + Build Chromium (tag 151.0.7922.34 / arm64)
        shell: pwsh
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
          DEPOT_TOOLS_UPDATE: '0'
          AGGRESSIVE_DISK: '1'
          DELETE_GIT_AFTER_SYNC: ${{ inputs.delete_git_after_sync && '1' || '0' }}
          DEPOT_TOOLS: ${{ runner.temp }}/depot_tools
          CHROMIUM_ROOT: ${{ runner.temp }}/chromium
          GCLIENT_CACHE_DIR: ${{ runner.temp }}/gclient-cache
        run: |
          .\scripts\build-chromium-win-arm64.ps1

      - name: Pack Playwright layout
        shell: pwsh
        env:
          CHROMIUM_ROOT: ${{ runner.temp }}/chromium
        run: |
          $from = Join-Path $env:CHROMIUM_ROOT 'src\out\Default'
          if (-not (Test-Path $from)) { throw "Missing $from" }
          New-Item -ItemType Directory -Force -Path work | Out-Null
          $fmt = '7z'
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            Write-Warning '7z not on PATH; packing as zip'
            $fmt = 'zip'
          }
          node scripts/pack-playwright-layout.mjs --from-dir $from --out-dir work --format $fmt
          Get-ChildItem work | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_STEM }}
          path: |
            work/${{ env.PACKAGE_STEM }}.7z
            work/${{ env.PACKAGE_STEM }}.zip
            work/${{ env.PACKAGE_STEM }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Create / update Release ${{ env.RELEASE_TAG }}
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Playwright Chromium Windows ARM64 ${{ env.RELEASE_TAG }}
          body: |
            Self-built **open-source Chromium** for Playwright Python **1.62.0**.

            | Pin | Value |
            |-----|--------|
            | Chromium revision | **1234** |
            | Chrome tag | **151.0.7922.34** |
            | Layout | `chromium-1234/chrome-win64/chrome.exe` |
            | PE Machine | **AA64** |
            | Package | `${{ env.PACKAGE_STEM }}` |

            Runner: `${{ inputs.runner }}` (AtlasGraph reference label: `windows-11-arm`).
            Pipeline: single-job sync + build (hosted 6h/job cap; avoids cross-job cache handoff).

            **Not** Google Chrome / Microsoft Edge. Chromium BSD-style license applies to the binary.
          files: |
            work/${{ env.PACKAGE_STEM }}.7z
            work/${{ env.PACKAGE_STEM }}.zip
            work/${{ env.PACKAGE_STEM }}.json
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Save after success path mostly; still try after pack so next run warms faster.
      # If cache >~10GB, save may fail — continue so Release is not blocked.
      - name: Save depot_tools + gclient cache
        if: ${{ success() || failure() }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/depot_tools
            ${{ runner.temp }}/gclient-cache
          key: ${{ env.CACHE_SCHEMA }}-winarm-gclient-${{ env.CHROME_TAG }}-${{ runner.os }}-${{ inputs.runner }}-${{ github.run_id }}